<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Shoka w Sekena</title>
<style>
:root{--ink:#2d2926;--muted:#777;--line:#ece7e2;--brand:#6b4f3a;--soft:#f8f5f2}
*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;color:var(--ink);background:#fff}
header{padding:22px 16px 14px;text-align:center;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:25px}header p{margin:6px 0 0;color:var(--muted);font-size:13px}
.wrap{max-width:980px;margin:auto;padding:14px}.search{position:sticky;top:0;background:#fff;padding:8px 0;z-index:2}
input{width:100%;padding:13px 15px;border:1px solid var(--line);border-radius:14px;font-size:16px}
.cats{display:flex;gap:8px;overflow:auto;padding:8px 0 14px}.cats button{white-space:nowrap;border:1px solid var(--line);background:#fff;padding:9px 13px;border-radius:999px}
.cats button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.top{display:flex;justify-content:space-between;align-items:center;margin:2px 0 12px}.top span{font-size:13px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}
.pic{aspect-ratio:1;background:var(--soft);display:flex;align-items:center;justify-content:center;color:#aaa;font-size:13px}
.pic img{width:100%;height:100%;object-fit:contain;background:#fff}
.info{padding:11px}.code{font-size:11px;color:var(--muted)}.name{font-size:14px;font-weight:700;min-height:36px;margin-top:5px}
.price{font-size:18px;font-weight:800;margin:8px 0}.stock{font-size:11px;margin-bottom:8px;color:#2f7a46}.out{color:#a43d3d}
.order{width:100%;border:0;border-radius:10px;padding:10px;background:var(--brand);color:#fff;font-weight:700}.order:disabled{opacity:.4}
.empty{text-align:center;color:var(--muted);padding:40px 0}.loading{text-align:center;padding:40px;color:var(--muted)}
@media(min-width:700px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
</style>
</head>
<body>
<header><h1>Shoka w Sekena</h1><p>كل احتياجات بيتك في مكان واحد</p></header>
<div class="wrap">
<div class="search"><input id="q" placeholder="ابحث بالاسم أو كود المنتج"></div>
<div id="cats" class="cats"></div>
<div class="top"><strong>المنتجات</strong><span id="count">جاري التحميل...</span></div>
<main id="grid" class="grid"><div class="loading">جاري تحميل المنتجات من Google Sheets…</div></main>
</div>
<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQHq5y7WXRB_GtBvMGnPVbKaCPwucml2HhedVHRP2HCls01814p76EIZ8djtR5O1c7vkNVRrRyzr_7P/pub?gid=0&single=true&output=csv";
let all=[], active="الكل";
const grid=document.querySelector("#grid"),q=document.querySelector("#q"),cats=document.querySelector("#cats"),count=document.querySelector("#count");

function parseCSV(text){
  const rows=[]; let row=[], field="", quote=false;
  for(let i=0;i<text.length;i++){
    const c=text[i], n=text[i+1];
    if(c=='"' && quote && n=='"'){field+='"';i++}
    else if(c=='"'){quote=!quote}
    else if(c==','&&!quote){row.push(field);field=""}
    else if((c=='\n'||c=='\r')&&!quote){
      if(c=='\r'&&n=='\n')i++;
      row.push(field);field="";
      if(row.some(x=>x.trim()!==""))rows.push(row);
      row=[];
    } else field+=c;
  }
  if(field||row.length){row.push(field);rows.push(row)}
  if(rows.length<2)return [];
  const h=rows[0].map(x=>x.trim().toLowerCase());
  const ix=(...names)=>{for(const n of names){const j=h.indexOf(n);if(j>=0)return j}return -1};
  const ci=ix("code","الكود"), ni=ix("name","اسم المنتج"), cai=ix("category","القسم"),
        pi=ix("price","السعر"), si=ix("status","الحالة"), ii=ix("image","رابط الصورة","الصورة");
  return rows.slice(1).map(r=>({
    code:(r[ci]||"").trim(), name:(r[ni]||"").trim(), category:(r[cai]||"عام").trim(),
    price:Number(String(r[pi]||"0").replace(/[^\d.]/g,""))||0,
    status:(r[si]||"متوفر").trim(), image:(r[ii]||"").trim()
  })).filter(p=>p.code||p.name).filter(p=>p.status!=="مخفي");
}
function safe(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function buildCats(){
  const list=["الكل",...new Set(all.map(p=>p.category).filter(Boolean))];
  cats.innerHTML=list.map(c=>`<button type="button" data-c="${safe(c)}" class="${c==="الكل"?"on":""}">${safe(c)}</button>`).join("");
}
function render(){
  const s=q.value.trim().toLowerCase();
  const rows=all.filter(p=>(active==="الكل"||p.category===active)&&(!s||p.name.toLowerCase().includes(s)||p.code.toLowerCase().includes(s)));
  count.textContent=rows.length+" منتج";
  grid.innerHTML=rows.length?rows.map(p=>`<article class="card">
    <div class="pic">${p.image?`<img src="${safe(p.image)}" alt="${safe(p.name)}" loading="lazy" referrerpolicy="no-referrer">`:"صورة المنتج"}</div>
    <div class="info"><div class="code">${safe(p.code)}</div><div class="name">${safe(p.name)}</div>
    <div class="price">${Number(p.price).toLocaleString("ar-EG")} ج.م</div>
    <div class="stock ${p.status!=="متوفر"?"out":""}">${safe(p.status)}</div>
    <button class="order" type="button" ${p.status!=="متوفر"?"disabled":""} data-code="${safe(p.code)}" data-name="${safe(p.name)}">اطلب على واتساب</button></div>
  </article>`).join(""):`<div class="empty">لا توجد منتجات مطابقة</div>`;
}
async function load(){
  try{
    const r=await fetch(CSV_URL,{cache:"no-store"});
    if(!r.ok)throw new Error("HTTP "+r.status);
    all=parseCSV(await r.text()); buildCats(); render();
  }catch(e){
    count.textContent="تعذر التحميل";
    grid.innerHTML='<div class="empty">تعذر تحميل المنتجات. تأكد أن Google Sheet منشور بصيغة CSV.</div>';
  }
}
cats.addEventListener("click",e=>{const b=e.target.closest("button");if(!b)return;active=b.dataset.c;[...cats.children].forEach(x=>x.classList.toggle("on",x===b));render()});
q.addEventListener("input",render);
grid.addEventListener("click",e=>{const b=e.target.closest(".order");if(!b)return;const msg=`مرحبًا، أريد طلب ${b.dataset.name} - كود ${b.dataset.code}`;window.open("https://wa.me/?text="+encodeURIComponent(msg),"_blank")});
load();
</script>
</body></html>
